name: Database backup

on:
  schedule:
    # 03:17 UTC daily. Off the hour so it does not collide with everyone else's
    # cron, and after the reconciliation job has had a quiet night.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual backup is being taken"
        required: false

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump → encrypt → retain
    runs-on: ubuntu-latest
    # Fails loudly rather than silently skipping: a backup job that quietly
    # does nothing is worse than no backup job, because it looks like cover.
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are present
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          [ -z "$DATABASE_URL" ] && { echo "::error::BACKUP_DATABASE_URL secret is not set"; missing=1; }
          [ -z "$BACKUP_PASSPHRASE" ] && { echo "::error::BACKUP_PASSPHRASE secret is not set"; missing=1; }
          exit $missing

      - name: Install postgresql-client 16
        # The client major version must be >= the server, or pg_dump refuses.
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - name: Take backup
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          chmod +x scripts/backup.sh
          scripts/backup.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: spreddpay-backup-${{ github.run_id }}
          path: backups/*.enc
          # GitHub's maximum. Encrypted at rest by our own passphrase, so the
          # artifact store never holds readable financial data.
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Database backup"
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Taken | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Size | $(du -h backups/*.enc | cut -f1) |"
            echo "| Retention | 90 days |"
            echo
            echo 'Restore: `BACKUP_PASSPHRASE=… RESTORE_DATABASE_URL=… scripts/restore.sh <file>`'
          } >> "$GITHUB_STEP_SUMMARY"
